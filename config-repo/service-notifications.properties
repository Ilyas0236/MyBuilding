server.port=8084

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=mybuilding
spring.rabbitmq.password=mybuilding

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

mybuilding.messaging.exchange=mybuilding.events
mybuilding.messaging.queue=notifications.incident-created
mybuilding.messaging.routing-key=incident.created
mybuilding.notification.from=noreply@mybuilding.local
mybuilding.notification.default-recipient=notifications@mybuilding.local

eureka.instance.instance-id=${spring.application.name}:${server.port}
