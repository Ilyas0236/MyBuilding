# ===================================================================
# Microservice Incidents - Configuration Centralisée (Port 8082)
# ===================================================================
server.port=8082

# --- Base de données H2 en mémoire dédiée ---
spring.datasource.url=jdbc:h2:mem:incidentsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 & JPA Hibernate ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Identifiant d'instance Eureka ---
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- RabbitMQ Publisher ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=mybuilding
spring.rabbitmq.password=mybuilding


# --- Resilience4j Configuration (CircuitBreaker, Retry, TimeLimiter) ---
resilience4j.circuitbreaker.instances.residentsService.sliding-window-size=5
resilience4j.circuitbreaker.instances.residentsService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.residentsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.residentsService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.residentsService.register-health-indicator=true

resilience4j.retry.instances.residentsService.max-attempts=3
resilience4j.retry.instances.residentsService.wait-duration=1s

resilience4j.timelimiter.instances.residentsService.timeout-duration=3s
