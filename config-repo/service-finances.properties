# ===================================================================
# Microservice Finances - Configuration Centralisée (Port 8083)
# ===================================================================
server.port=8083

# --- Base de données H2 en mémoire dédiée ---
spring.datasource.url=jdbc:h2:mem:financesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 & JPA Hibernate ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- Identifiant d'instance Eureka ---
eureka.instance.instance-id=${spring.application.name}:${server.port}


# --- OpenFeign Timeouts (connect / read) ---
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

# --- Resilience4j Configuration (CircuitBreaker outer=1, Retry inner=2) ---
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.circuitbreaker.instances.residentsService.sliding-window-size=5
resilience4j.circuitbreaker.instances.residentsService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.residentsService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.residentsService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.residentsService.register-health-indicator=true
resilience4j.circuitbreaker.instances.residentsService.ignore-exceptions[0]=feign.FeignException$NotFound

resilience4j.retry.retry-aspect-order=2
resilience4j.retry.instances.residentsService.max-attempts=3
resilience4j.retry.instances.residentsService.wait-duration=500ms
resilience4j.retry.instances.residentsService.enable-exponential-backoff=true
resilience4j.retry.instances.residentsService.exponential-backoff-multiplier=2
resilience4j.retry.instances.residentsService.ignore-exceptions[0]=feign.FeignException$NotFound
